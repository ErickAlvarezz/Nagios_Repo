---
- hosts: all
  become: true

  tasks:

    - name: Install Nagios dependencies on Ubuntu
      ansible.builtin.apt:
        name:
          - apache2
          - php
          - gcc
          - make
          - libc6
          - libgd-dev
          - libssl-dev
          - libapache2-mod-php
          - unzip
          - wget
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Install Nagios dependencies on CentOS
      ansible.builtin.dnf:
        name:
          - httpd
          - php
          - gcc
          - glibc
          - glibc-common
          - gd
          - gd-devel
          - make
          - openssl-devel
          - net-snmp
          - net-snmp-utils
          - unzip
          - wget
        state: present
      when: ansible_distribution == "CentOS"
